# The sensors come from the SLPI through hexagonrpcd, not from IIO. Start after
# the file server has attached to the sensor process and give the DSP a moment
# to enumerate its sensors, or the daemon exits with "No sensors".
[Unit]
After=hexagonrpcd-sdsp.service
ConditionPathExists=/dev/fastrpc-sdsp

[Service]
ExecStartPre=/bin/sleep 8
