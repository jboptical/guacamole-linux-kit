# OnePlus 7 Pro: Wi-Fi power save off (installed to /etc/NetworkManager/conf.d/
# by setup-network.sh). With it on, the WCN3990 sleeps between beacons (about
# 100 ms), so everything sent to the phone waits for its next wake-up: pings
# 2-125 ms (median ~100 ms) instead of 2-3 ms. Measured cost: about +0.3 W.
# Undo: delete this file and reconnect Wi-Fi (or: iw dev wlan0 set power_save on).
[connection]
# 2 = disable, 3 = enable
wifi.powersave = 2
