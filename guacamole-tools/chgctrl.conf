# OnePlus 7 Pro battery-care charge window (guacamole-chgctrl).
# Edit here or in Guacamole Panel; apply with: systemctl reload guacamole-chgctrl
#
# Charge to CHG_MAX, then hold: with the kit kernel (patch 0105) charging is
# inhibited and the charger powers the phone, so the battery sits idle; older
# kernels suspend the charger input and run from the battery instead (USB data
# and DisplayPort keep working). Below CHG_RESUME it charges again.
# Every DEEP_EVERY_DAYS days the phone instead runs down to DEEP_MIN once.
# For a phone that stays on the charger (server), 60 / 58 / 58 / 0 keeps the
# battery at a gentle 60 % with almost no cycling.
# CHG_MAX=100 turns the limit off. DEEP_EVERY_DAYS=0 turns deep cycles off.
CHG_MAX=80
CHG_RESUME=75
DEEP_MIN=60
DEEP_EVERY_DAYS=7

# Input limit on a PC port (SDP) in microamps; 0 = 500 mA (USB 2) / 900 mA (USB 3)
CHG_SDP_UA=0
